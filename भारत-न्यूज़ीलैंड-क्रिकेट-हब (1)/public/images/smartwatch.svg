<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" fill="none">
  <defs>
    <linearGradient id="bg_watch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="dial" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bg_watch)"/>
  <!-- Watch Strap Top -->
  <path d="M230 40 L230 140 L370 140 L370 40 Z" fill="#334155" rx="8"/>
  <!-- Watch Strap Bottom -->
  <path d="M230 310 L230 410 L370 410 L370 310 Z" fill="#334155" rx="8"/>
  <!-- Watch Body Case -->
  <rect x="200" y="125" width="200" height="200" rx="42" fill="#1E293B" stroke="#475569" stroke-width="4"/>
  <!-- Crown Button -->
  <rect x="402" y="180" width="12" height="40" rx="4" fill="#64748B"/>
  <!-- Screen Inner -->
  <rect x="216" y="141" width="168" height="168" rx="30" fill="#020617"/>
  <!-- Digital Watch Face Elements -->
  <circle cx="300" cy="225" r="60" stroke="url(#dial)" stroke-width="6" stroke-linecap="round" stroke-dasharray="280 60"/>
  <text x="300" y="210" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" text-anchor="middle">10:09</text>
  <text x="300" y="235" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">7,420 STEPS</text>
  <text x="300" y="255" fill="#EC4899" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">♥ 72 BPM</text>
  <!-- Vector Tag -->
  <rect x="20" y="20" width="130" height="26" rx="6" fill="#334155"/>
  <text x="85" y="37" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">स्मार्टवॉच इलस्ट्रेशन</text>
</svg>
