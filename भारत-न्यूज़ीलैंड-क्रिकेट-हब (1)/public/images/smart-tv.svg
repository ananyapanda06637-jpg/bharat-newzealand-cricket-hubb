<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" fill="none">
  <defs>
    <linearGradient id="bg_tv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0F1D"/>
      <stop offset="100%" stop-color="#182235"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bg_tv)"/>
  <!-- TV Bezel -->
  <rect x="70" y="60" width="460" height="270" rx="8" fill="#020617" stroke="#475569" stroke-width="4"/>
  <!-- TV Screen -->
  <rect x="80" y="70" width="440" height="250" fill="#0369A1"/>
  <!-- Stadium Green Field on TV -->
  <ellipse cx="300" cy="270" rx="200" ry="80" fill="#15803D"/>
  <circle cx="300" cy="180" r="16" fill="#DC2626"/>
  <rect x="420" y="85" width="85" height="24" rx="4" fill="#000000" opacity="0.6"/>
  <text x="462" y="102" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">LIVE 4K</text>
  <!-- TV Stand Legs -->
  <path d="M160 330 L140 370" stroke="#64748B" stroke-width="6" stroke-linecap="round"/>
  <path d="M440 330 L460 370" stroke="#64748B" stroke-width="6" stroke-linecap="round"/>
  <!-- Vector Tag -->
  <rect x="20" y="20" width="130" height="26" rx="6" fill="#1E293B"/>
  <text x="85" y="37" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">स्मार्ट टीवी इलस्ट्रेशन</text>
</svg>
